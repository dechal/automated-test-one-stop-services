# =============================================================================
# Workspace CI/CD (GitHub Actions) — validate every push to main; release the
# one-click installers on a git tag. Ports the former .gitlab-ci.yml.
#
# SCOPE: the portable test tools (tools/playwright | robot-framework | k6) live
# in their OWN git repos (still on GitLab) and are git-ignored here, so they are
# NOT present in a CI checkout. This pipeline validates only the main-repo code:
# script modules (scripts/manifests, scripts/install-core), the Hub
# (hub/shared, hub/server, hub/client), and the workspace script tests
# (scripts/__tests__). The optional AI layer and knowledge vault live in their
# own separate repos, so this pipeline never references them.
# No uv/Python, no Playwright browsers, no Docker, no secrets needed.
#
# Node + pnpm match package.json `volta` (node 26.x, pnpm 11.23.0).
# =============================================================================

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# A newer push to the same ref cancels superseded, still-running runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611
        with:
          repo-token: ${{ github.token }}
      # When the tool repos are unreachable the manifest-integration tests
      # self-skip via the realToolsPresent guard — the run stays green.
      - uses: ./.github/actions/clone-tools
      - run: task check
      - name: Test quality (soft signal — never blocks)
        continue-on-error: true
        run: node scripts/eval/test-quality.mjs

  without-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: mv hub "$RUNNER_TEMP/hub-removed"
      - uses: ./.github/actions/setup
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611
        with:
          repo-token: ${{ github.token }}
      - run: task --list
      - run: task check

  fresh-setup:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git xz-utils
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: SETUP_SKIP_HUB=1 SETUP_NO_OPEN=1 bash scripts/setup/setup-linux.sh
      - shell: bash
        run: |
          export PATH="$HOME/.volta/bin:$HOME/.local/bin:$PATH" VOLTA_FEATURE_PNPM=1
          if command -v tsx || command -v dotenvx; then exit 1; fi
          task status

  # Dependency advisories. This FAILS on a high-severity finding — the tree was
  # taken to zero on 2026-08-17, so red here means "something new arrived", not
  # "we still have not started". It is deliberately NOT in `release.needs`: an
  # advisory is published by a third party without any commit in this repo, so it
  # must be visible on every run without holding a tagged release hostage.
  # A fix is a bump of the direct dependency, or a bounded entry under
  # `overrides:` in pnpm-workspace.yaml (bound the major — see the note there).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup
      - name: pnpm audit (high and above)
        run: pnpm audit --audit-level=high

  release:
    needs: [check, without-hub, fresh-setup]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # The installers are not code-signed, so publish checksums next to them.
      # Run from scripts/setup so the file holds plain basenames — after both
      # assets are downloaded into one folder, `sha256sum -c` / `shasum -c` works.
      - name: Generate SHA256 checksums for installers
        working-directory: scripts/setup
        run: |
          sha256sum \
            automated-test-one-stop-service_installer_windows.bat \
            automated-test-one-stop-service_installer_mac-and-linux.sh \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub Release with installers
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          name: Release ${{ github.ref_name }}
          body: |
            Automated Test One-Stop Service — ${{ github.ref_name }}

            One-click installers (download the file for your OS and run it; it
            bootstraps git, clones the workspace, and runs setup):

            The installers are not code-signed. To check you got the published
            file, download SHA256SUMS.txt into the same folder, then:
            - Windows: `certutil -hashfile <file> SHA256` and compare the hash.
            - macOS / Linux: `shasum -a 256 -c SHA256SUMS.txt`
          files: |
            scripts/setup/automated-test-one-stop-service_installer_windows.bat
            scripts/setup/automated-test-one-stop-service_installer_mac-and-linux.sh
            scripts/setup/SHA256SUMS.txt
