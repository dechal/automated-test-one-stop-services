# =============================================================================
# Composite action: install pnpm + Node (matching package.json `volta`) and
# install workspace deps with a frozen lockfile. Shared by the lint / typecheck
# / test jobs so the setup block lives in ONE place.
#
# The caller must run actions/checkout FIRST — a local composite action is read
# from the checked-out repo. The release job does not use this (it installs no
# deps).
# =============================================================================
name: Setup Node + pnpm
description: Install pnpm and Node from package.json `volta`, then pnpm install --frozen-lockfile.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      with:
        version: 11.23.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version-file: package.json
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
